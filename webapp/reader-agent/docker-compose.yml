# Runs on the OPERATOR'S OWN machine, next to the physical reader and the
# browser — not part of webapp/docker-compose.yml, which can live on a
# separate/shared server. Requires pcscd + libpcsclite1 installed and
# running on the host (see ../README.md's reader-agent section for the
# kernel-driver-conflict fix some PN532-based readers, e.g. the ACR122U,
# need); this container talks to that host pcscd over its Unix socket
# instead of accessing the USB device itself, so no --privileged or device
# passthrough is needed.
services:
  reader-agent:
    build:
      context: .
      # Some networks' DNS setup only works from the host's own network
      # namespace, not Docker's isolated bridge network used during a build
      # — host networking for the build avoids apt-get failing to resolve
      # the package mirror in that case. Harmless if your network doesn't
      # have this problem.
      network: host
    ports:
      - "127.0.0.1:17420:17420"
    volumes:
      - /run/pcscd:/run/pcscd
    restart: unless-stopped
